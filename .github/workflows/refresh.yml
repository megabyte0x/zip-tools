name: refresh
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, ref: main }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Pull the latest zcash/zips
        run: git submodule update --remote submodule/zips
      - name: Upsert issue snapshots
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        # Partial fetch failures keep the previous snapshot for that issue; don't block the commit.
        run: pnpm issues:refresh || echo "::warning::some issue refreshes failed"
      - name: Commit and redeploy when data changed
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git add submodule/zips packages/index/issue-snapshots.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(data): refresh zips and issue snapshots"
          git push origin HEAD:main
          # GITHUB_TOKEN pushes don't trigger push workflows; dispatch ci (test + deploy) explicitly.
          gh workflow run ci.yml --ref main
